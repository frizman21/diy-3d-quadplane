[project]
name = "quadplane"
version = "0.1.0"
description = "Parametric 3D-printed VTOL quadplane (build123d)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.9",
    "numpy",
    "scipy",
    "matplotlib",
    "aerosandbox>=4.2",
    "neuralfoil",
]

[dependency-groups]
dev = [
    "pytest",
    "ocp_vscode",
]

[tool.uv]
package = false
